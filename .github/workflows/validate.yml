name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: libobs-sharp-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Validate
        shell: bash
        run: ./scripts/validate.sh
